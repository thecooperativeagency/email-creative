<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<meta name="color-scheme" content="dark" />
<title>Ada — Private</title>
<style>
  :root {
    --bg: #07080c;
    --bg2: #0d1018;
    --ink: #f3f0ea;
    --muted: rgba(243,240,234,.55);
    --dim: rgba(243,240,234,.28);
    --line: rgba(255,255,255,.08);
    --accent: #c4a574;
    --accent2: #7eb8c9;
    --danger: #c45c5c;
    --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(126,184,201,.08), transparent 55%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(196,165,116,.06), transparent 50%);
  }
  #app {
    position: relative; z-index: 1;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* top bar */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px 10px;
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(10px);
    background: rgba(7,8,12,.72);
  }
  .brand {
    display: flex; flex-direction: column; gap: 2px;
  }
  .brand strong {
    font-family: var(--display);
    font-weight: 600;
    letter-spacing: .04em;
    font-size: 1.15rem;
  }
  .brand span {
    font-size: .68rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .meta {
    display: flex; align-items: center; gap: 14px;
    color: var(--muted);
    font-size: .78rem;
    letter-spacing: .06em;
  }
  .pill {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    color: var(--dim);
    font-size: .65rem;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  /* stage */
  main {
    position: relative;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 12px 16px 8px;
  }
  .frame {
    position: relative;
    width: min(92vw, 920px);
    height: min(78vh, 1100px);
    display: grid;
    place-items: center;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    opacity: 0;
    transform: scale(1.02);
    transition: opacity .55s ease, transform .7s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
    z-index: 2;
  }
  .slide img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 10px;
    box-shadow:
      0 30px 80px rgba(0,0,0,.55),
      0 0 0 1px rgba(255,255,255,.06);
    background: #0a0c12;
  }
  .caption {
    position: absolute;
    left: 50%;
    bottom: -2px;
    transform: translate(-50%, 100%);
    margin-top: 14px;
    text-align: center;
    width: min(90vw, 640px);
    pointer-events: none;
  }
  .caption .group {
    color: var(--accent2);
    font-size: .68rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .caption .title {
    font-family: var(--display);
    font-size: clamp(1rem, 2.2vw, 1.35rem);
    font-weight: 500;
    letter-spacing: .02em;
  }

  /* controls */
  footer {
    display: grid;
    gap: 10px;
    padding: 10px 18px 16px;
    border-top: 1px solid var(--line);
    background: rgba(7,8,12,.8);
    backdrop-filter: blur(12px);
  }
  .progress {
    height: 2px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress > i {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width .35s ease;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  button {
    appearance: none;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.03);
    color: var(--ink);
    border-radius: 999px;
    min-width: 44px;
    min-height: 40px;
    padding: 0 14px;
    font: inherit;
    font-size: .78rem;
    letter-spacing: .08em;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.16); }
  button:active { transform: translateY(1px); }
  button.primary {
    border-color: rgba(196,165,116,.35);
    color: var(--accent);
  }
  button.active-play {
    border-color: rgba(126,184,201,.45);
    color: var(--accent2);
  }
  .count {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: .8rem;
    min-width: 5.5rem;
    text-align: center;
  }
  .thumbs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 0 4px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.15) transparent;
  }
  .thumbs button {
    flex: 0 0 auto;
    width: 52px;
    height: 68px;
    min-width: 52px;
    min-height: 68px;
    padding: 0;
    border-radius: 6px;
    overflow: hidden;
    opacity: .45;
    border-color: transparent;
  }
  .thumbs button.on {
    opacity: 1;
    border-color: rgba(196,165,116,.7);
    box-shadow: 0 0 0 1px rgba(196,165,116,.25);
  }
  .thumbs img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .hint {
    color: var(--dim);
    font-size: .65rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    text-align: right;
  }
  @media (max-width: 720px) {
    .hint { display: none; }
    .frame { height: min(68vh, 900px); }
    header { padding: 12px 14px 8px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <strong>Ada</strong>
      <span>Private archive</span>
    </div>
    <div class="meta">
      <span id="groupLabel">—</span>
      <span class="pill">Lance · Ada only</span>
    </div>
  </header>

  <main>
    <div class="frame" id="stage" aria-live="polite"></div>
    <div class="caption">
      <div class="group" id="capGroup"></div>
      <div class="title" id="capTitle"></div>
    </div>
  </main>

  <footer>
    <div class="progress"><i id="prog"></i></div>
    <div class="bar">
      <div class="nav">
        <button type="button" id="btnPrev" title="Previous (←)">Prev</button>
        <button type="button" id="btnPlay" class="primary" title="Slideshow (Space)">Play</button>
        <button type="button" id="btnNext" title="Next (→)">Next</button>
      </div>
      <div class="count" id="count">0 / 0</div>
      <div class="hint">← → · Space · F fullscreen</div>
    </div>
    <div class="thumbs" id="thumbs" aria-label="Thumbnails"></div>
  </footer>
</div>

<script>
(async function () {
  const res = await fetch('slides.json', { cache: 'no-store' });
  const data = await res.json();
  const slides = data.slides || [];
  if (!slides.length) {
    document.getElementById('capTitle').textContent = 'No slides';
    return;
  }

  const stage = document.getElementById('stage');
  const thumbs = document.getElementById('thumbs');
  const prog = document.getElementById('prog');
  const countEl = document.getElementById('count');
  const capGroup = document.getElementById('capGroup');
  const capTitle = document.getElementById('capTitle');
  const groupLabel = document.getElementById('groupLabel');
  const btnPlay = document.getElementById('btnPlay');

  // build slides + thumbs
  slides.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === 0 ? ' active' : '');
    div.dataset.i = i;
    const img = document.createElement('img');
    img.src = s.src;
    img.alt = s.title || 'Ada';
    img.loading = i < 3 ? 'eager' : 'lazy';
    img.decoding = 'async';
    div.appendChild(img);
    stage.appendChild(div);

    const t = document.createElement('button');
    t.type = 'button';
    t.className = i === 0 ? 'on' : '';
    t.title = s.title;
    t.innerHTML = `<img src="${s.src}" alt="">`;
    t.addEventListener('click', () => go(i, true));
    thumbs.appendChild(t);
  });

  let i = 0;
  let playing = false;
  let timer = null;
  const INTERVAL = 4200;
  const nodes = [...stage.querySelectorAll('.slide')];
  const thumbNodes = [...thumbs.querySelectorAll('button')];

  function render() {
    nodes.forEach((n, idx) => n.classList.toggle('active', idx === i));
    thumbNodes.forEach((n, idx) => n.classList.toggle('on', idx === i));
    const s = slides[i];
    capGroup.textContent = s.group || '';
    capTitle.textContent = s.title || '';
    groupLabel.textContent = s.group || '';
    countEl.textContent = `${i + 1} / ${slides.length}`;
    prog.style.width = `${((i + 1) / slides.length) * 100}%`;
    thumbNodes[i]?.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    // prefetch neighbors
    [i - 1, i + 1, i + 2].forEach(j => {
      if (slides[j]) {
        const im = new Image();
        im.src = slides[j].src;
      }
    });
  }

  function go(n, user) {
    i = (n + slides.length) % slides.length;
    render();
    if (user && playing) restartTimer();
  }
  function next() { go(i + 1); }
  function prev() { go(i - 1); }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(next, INTERVAL);
  }
  function play() {
    playing = true;
    btnPlay.textContent = 'Pause';
    btnPlay.classList.add('active-play');
    restartTimer();
  }
  function pause() {
    playing = false;
    btnPlay.textContent = 'Play';
    btnPlay.classList.remove('active-play');
    clearInterval(timer);
  }
  function toggle() { playing ? pause() : play(); }

  document.getElementById('btnNext').onclick = () => { next(); if (playing) restartTimer(); };
  document.getElementById('btnPrev').onclick = () => { prev(); if (playing) restartTimer(); };
  btnPlay.onclick = toggle;

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'j') { e.preventDefault(); next(); if (playing) restartTimer(); }
    if (e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); prev(); if (playing) restartTimer(); }
    if (e.key === ' ' || e.key === 'p') { e.preventDefault(); toggle(); }
    if (e.key === 'f') {
      e.preventDefault();
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }
    if (e.key === 'Escape' && playing) pause();
  });

  // touch swipe
  let x0 = null;
  stage.addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); if (playing) restartTimer(); }
    x0 = null;
  }, { passive: true });

  render();
  // auto-start slideshow vibe after a beat
  setTimeout(play, 800);
})();
</script>
</body>
</html>
